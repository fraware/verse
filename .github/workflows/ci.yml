name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Only the newest revision on a branch can publish or report final checks.
concurrency:
  group: verse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Check release automation shell syntax
        run: bash -n scripts/verify-release-ci.sh scripts/publish-milestone-releases.sh scripts/cleanup-audited-branches.sh
      - name: Verify shared brand asset and dash-free website copy
        run: node scripts/check-brand.mjs
      - run: npm run test:unit
      - name: Block runtime and build dependency advisories
        run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm run verify:dist

  browser:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install smoke-test browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Build with GitHub Pages base
        run: |
          GITHUB_PAGES=true npm run build
          GITHUB_PAGES=true npm run verify:dist
      - name: Start site and run browser interactions
        run: |
          GITHUB_PAGES=true npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/verse-preview.log 2>&1 &
          for browser in chromium firefox webkit; do
            VERSE_BROWSER="$browser" node scripts/smoke.mjs
            VERSE_BROWSER="$browser" node scripts/privacy.mjs
            VERSE_BROWSER="$browser" node scripts/concurrency.mjs
            VERSE_BROWSER="$browser" node scripts/style-regression.mjs
            VERSE_BROWSER="$browser" node scripts/backup-freshness.mjs
            VERSE_BROWSER="$browser" node scripts/brand-regression.mjs
            VERSE_BROWSER="$browser" node scripts/editor-safety.mjs
            VERSE_BROWSER="$browser" node scripts/literary-catalogue.mjs
            VERSE_BROWSER="$browser" node scripts/craft-experiments.mjs
            VERSE_BROWSER="$browser" node scripts/pilot-study.mjs
          done
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verse-smoke-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  accessibility:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install axe and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4
          npx playwright install --with-deps chromium
      - name: Build with GitHub Pages base
        run: |
          GITHUB_PAGES=true npm run build
          GITHUB_PAGES=true npm run verify:dist
      - name: Run WCAG A/AA checks
        run: |
          GITHUB_PAGES=true npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/verse-a11y.log 2>&1 &
          node scripts/a11y.mjs
      - name: Upload accessibility audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verse-axe-results
          path: test-artifacts/axe-results.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, browser, accessibility]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducibly
        run: npm ci
      - name: Build for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Verify and prepare SPA fallback
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm run verify:dist
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
